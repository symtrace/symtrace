name: Release Automation & Security Provenance

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build & Package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: symtrace-x86_64-unknown-linux-gnu.tar.gz
            asset_name: symtrace
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: symtrace-x86_64-pc-windows-msvc.zip
            asset_name: symtrace.exe

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Optimized Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Create Release Archive (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          tar -czvf ${{ matrix.artifact_name }} -C target/${{ matrix.target }}/release ${{ matrix.asset_name }}

      - name: Create Release Archive & Standalone Binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.asset_name }}" -DestinationPath "${{ matrix.artifact_name }}"
          Copy-Item -Path "target/${{ matrix.target }}/release/${{ matrix.asset_name }}" -Destination "symtrace.exe"

      - name: Upload Linux Archive Artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: ${{ matrix.artifact_name }}

      - name: Upload Windows Artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            ${{ matrix.artifact_name }}
            symtrace.exe

  release:
    name: Immutable GitHub Release, SBOM & Attestation
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-assets
          merge-multiple: true

      - name: Generate SPDX Software Bill of Materials (SBOM)
        uses: anchore/sbom-action@v0
        with:
          path: ./
          format: spdx-json
          output-file: ./release-assets/symtrace.spdx.json

      - name: Generate SHA256 Checksums
        run: |
          cd ./release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: './release-assets/*'

      - name: Attest SBOM
        uses: actions/attest-sbom@v1
        with:
          subject-path: './release-assets/symtrace-*.tar.gz, ./release-assets/symtrace-*.zip, ./release-assets/symtrace.exe'
          sbom-path: './release-assets/symtrace.spdx.json'

      - name: Publish Immutable GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false

