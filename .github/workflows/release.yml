name: Release Automation & Security Provenance

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build & Package Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: symtrace-x86_64-unknown-linux-gnu.tar.gz
            asset_name: symtrace
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: symtrace-x86_64-pc-windows-msvc.zip
            asset_name: symtrace.exe

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Optimized Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Create Release Archive (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          tar -czvf ${{ matrix.artifact_name }} -C target/${{ matrix.target }}/release ${{ matrix.asset_name }}

      - name: Create Release Archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.asset_name }}" -DestinationPath "${{ matrix.artifact_name }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  release:
    name: Provenance, Cosign & Immutable Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Generate SHA256 Checksums
        run: |
          cd ./artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Install Cosign for Blob Signing
        uses: sigstore/cosign-installer@v3.5.0

      - name: Generate SBOM (Software Bill of Materials)
        uses: anchore/sbom-action@v0.16.0
        with:
          format: spdx-json
          output-file: ./artifacts/symtrace.spdx.json

      - name: Sign Release Artifacts & Checksums with Cosign
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cd ./artifacts
          for file in *; do
            if [ -f "$file" ]; then
              cosign sign-blob --yes "$file" --output-signature "$file.sig" --output-certificate "$file.pem"
            fi
          done

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: './artifacts/*'

      - name: Create Immutable GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
